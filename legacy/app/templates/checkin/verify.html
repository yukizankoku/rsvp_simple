{% extends "base.html" %}
{% block title %}Verifikasi Check-in{% endblock %}
{% block content %}
<div class="mx-auto max-w-md space-y-4">
  <div>
    <a href="{{ url_for('checkin.index') }}" class="text-sm text-slate-500 hover:text-slate-700">← Scanner</a>
    <h1 class="mt-1 text-2xl font-bold text-slate-900">Verifikasi check-in</h1>
    {% if event %}<p class="text-sm text-slate-500">{{ event.name }}</p>{% endif %}
  </div>
  <div id="scan-result">{% include "checkin/_result.html" %}</div>
  <a href="{{ url_for('checkin.index') }}" class="btn-secondary w-full">Scan tamu berikutnya</a>
</div>
{% endblock %}
