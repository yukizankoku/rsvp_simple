<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR · {{ guest.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>@media print { .no-print { display: none } body { background: #fff } }</style>
</head>
<body class="grid min-h-screen place-items-center bg-slate-100 p-6 font-sans">
  <div class="w-full max-w-xs rounded-2xl bg-white p-6 text-center shadow-sm ring-1 ring-slate-200">
    <div class="text-xs font-semibold uppercase tracking-widest text-slate-500">{{ event.name }}</div>
    <div class="mt-1 text-sm text-slate-500">{{ event.event_date|date_id }}</div>
    <div class="mx-auto mt-4 w-56 [&>svg]:h-auto [&>svg]:w-full">{{ qr_svg|safe }}</div>
    <div class="mt-3 text-xl font-bold text-slate-900">{{ guest.name }}</div>
    <div class="font-mono text-sm text-slate-500">{{ guest.invitation_code }}</div>
    {% if guest.guest_code %}<div class="mt-1 text-sm font-medium">{{ guest.guest_code }}</div>{% endif %}
  </div>
  <button onclick="window.print()" class="no-print btn-primary mt-4">Print</button>
</body>
</html>
