<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="grid min-h-screen place-items-center bg-slate-100 p-6 font-sans">
  <div class="card max-w-md p-8 text-center">
    <div class="text-5xl font-bold text-brand-600">{{ code }}</div>
    <h1 class="mt-3 text-xl font-semibold text-slate-900">{{ title }}</h1>
    <p class="mt-2 text-slate-600">{{ message }}</p>
    <div class="mt-6 flex justify-center gap-3">
      <a href="javascript:history.back()" class="btn-secondary">Kembali</a>
      <a href="{{ url_for('auth.index') }}" class="btn-primary">Beranda</a>
    </div>
  </div>
</body>
</html>
